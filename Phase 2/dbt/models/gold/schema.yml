version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: bronze_crime_raw
      - name: bronze_stopsearch_raw

models:
  - name: dim_date
    description: "Calendar dimension with season and weekday info"
    columns:
      - name: DateKey
        tests: [unique, not_null]
      - name: FullDate
        tests: [not_null]

  - name: dim_location
    columns:
      - name: LocationKey
        tests: [unique, not_null]
      - name: LSOACode
        tests: [not_null]
  
  - name: dim_crime_outcome
    columns:
      - name: CrimeOutcomeKey
        tests: [unique, not_null]
      - name: OutcomeName
        tests: [not_null]
  
  - name: dim_demographics
    colums: 
      - name: DemographicsKey
        tests: [unique, not_null]

  - name: dim_search_outcome
    columns:
      - name: SearchOutcomeKey
        tests: [unique, not_null]

  - name: dim_search_detail
    columns:
      - name: SearchDetailKey
        tests: [unique, not_null]

  - name: fact_crime
    columns:
      - name: CrimeFactID
        tests: [unique, not_null]
      - name: DateKey
        tests: [not_null]
      - name: LocationKey
        tests: [not_null]

  - name: fact_stop_search
    columns:
      - name: StopFactID
        tests: [unique, not_null]
      - name: DateKey
        tests: [not_null]
